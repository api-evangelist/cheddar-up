aid: cheddar-up
name: Cheddar Up
description: >-
  Cheddar Up is an all-in-one online platform that helps groups and communities
  collect payments and forms in one place. Purpose-built for PTAs/PTOs, booster
  clubs, youth sports teams, nonprofits, schools, clubs, HOAs, churches, and
  other volunteer-led organizations, it lets organizers collect dues,
  registrations, donations, event fees, fundraisers, and group gifts without any
  technical setup. It combines online payments (credit card, e-check, Apple Pay,
  Google Pay, and Link), custom forms, waivers, sign-ups, recurring payments,
  itemized storefronts, automated tracking and reporting, and multi-manager team
  administration. For technical users, Cheddar Up exposes an embeddable
  JavaScript SDK (a guest-facing Checkout component instantiated via
  CheddarUpWidgetFactory), API keys on the Team plan, and a native webhooks
  integration for syncing collection and payment events to external apps.
